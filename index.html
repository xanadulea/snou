<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e12;
    --panel: #15171d;
    --line: #262932;
    --text: #e9e7e1;
    --muted: #8b8d96;
    --faint: #4a4d57;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 Inter, system-ui, sans-serif; padding: 28px 32px 60px; max-width: 1500px; margin: 0 auto; }
  h1 { font: italic 400 46px/1 "Instrument Serif", serif; margin: 0; letter-spacing: -0.5px; }
  h2 { font: 400 26px/1.1 "Instrument Serif", serif; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }

  /* kolokviji */
  .exams { display: flex; gap: 10px; flex-wrap: wrap; }
  .exam { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 150px; background: var(--panel); }
  .exam .n { font: 400 28px/1 "Instrument Serif", serif; }
  .exam .l { font-size: 12px; color: var(--muted); }
  .exam .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .exam.soon { border-color: #e8665a; }

  /* legenda */
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
  .chip { cursor: pointer; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 10px; font-size: 13px; background: transparent; color: var(--text); font-family: inherit; display: flex; align-items: center; gap: 7px; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip:hover, .chip.cur { border-color: var(--c); }
  .chip .qn { font-size: 11px; font-weight: 600; background: #fff; color: #111; border-radius: 999px; padding: 0 6px; }
  .chip .pct { color: var(--muted); font-size: 12px; }

  /* diagram */
  .stage { position: relative; overflow-x: auto; }
  #svg { display: block; width: 100%; min-width: 1000px; height: auto; }
  .arc { fill: none; stroke-width: 1.6; opacity: .55; transition: opacity .15s, stroke-width .15s; }
  .dim .arc { opacity: .06; }
  .dim .arc.on { opacity: 1; stroke-width: 2.6; }
  .arc-hit { fill: none; stroke: transparent; stroke-width: 10; cursor: help; }
  .bar { cursor: pointer; }
  .label { font-size: 11.5px; fill: var(--muted); cursor: pointer; }
  .label.on { fill: var(--text); font-weight: 600; }
  .dim .label:not(.on) { opacity: .35; }
  .sublabel { font: italic 17px "Instrument Serif", serif; }
  .tip { position: absolute; pointer-events: none; background: #000c; border: 1px solid var(--line); padding: 6px 10px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .1s; max-width: 280px; }

  /* spodnji del */
  .below { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 900px) { .below { grid-template-columns: 1fr; } body { padding: 20px 16px 40px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .empty { color: var(--muted); font-style: italic; }
  .status { display: flex; gap: 6px; margin: 12px 0 14px; }
  .status button { flex: 1; font-family: inherit; font-size: 13px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .status button.sel { color: #111; font-weight: 600; }
  .conns { list-style: none; padding: 0; margin: 0; }
  .conns li { padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .conns li:hover .nm { text-decoration: underline; }
  .conns .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
  .conns .why { color: var(--muted); font-size: 12.5px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 13.5px/1.5 Inter, sans-serif; }
  .sec { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 16px 0 6px; }
  .prog { margin: 10px 0; }
  .prog .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .prog .track { height: 8px; border-radius: 4px; background: var(--line); display: flex; overflow: hidden; }
  /* globlje */
  .deep { margin-top: 6px; }
  .tl { list-style: none; padding: 0; margin: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 84px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .tl li { display: grid; grid-template-columns: 76px 1fr; gap: 20px; padding: 6px 0; position: relative; }
  .tl li::before { content: ""; position: absolute; left: 81px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .tl .yr { font: 400 17px/1.2 "Instrument Serif", serif; color: var(--c); text-align: right; }
  .tl .tx { font-size: 13.5px; color: #cfcdc7; }
  .ideja p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.65; }
  .pic { display: flex; justify-content: center; padding: 10px 0; }
  .defn p { margin: 0 0 8px; }
  .defn .math { font: 400 20px/1.3 "Instrument Serif", serif; padding: 4px 0 4px 16px; border-left: 2px solid var(--c); }
  .defn .ex { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 12px; line-height: 1.7; }
  .star { pointer-events: none; }
  /* dnevi */
  .days { margin: 0 0 14px; padding: 14px 18px; display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .days .hm { overflow-x: auto; flex: 1 1 560px; }
  .days .hm svg { display: block; width: 100%; min-width: 560px; height: auto; }
  .cell { cursor: pointer; }
  .daylog { flex: 0 1 300px; min-width: 240px; font-size: 13.5px; }
  .daylog .d { font: 400 22px/1.1 "Instrument Serif", serif; margin-bottom: 6px; }
  .daylog ul { list-style: none; padding: 0; margin: 0; }
  .daylog li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .daylog .dot, .plan .dot, .tasks .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  /* načrt */
  .side { display: flex; flex-direction: column; gap: 18px; }
  .plan .p { padding: 12px 0; border-top: 1px solid var(--line); }
  .plan .p:first-of-type { border-top: 0; }
  .plan .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .plan .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .plan .when { font: 400 19px/1 "Instrument Serif", serif; white-space: nowrap; }
  .plan .pace { font-size: 12.5px; color: var(--muted); margin: 3px 0 7px; }
  .plan .next { display: flex; flex-wrap: wrap; gap: 6px; }
  .plan .next button { font: 12.5px Inter, sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .plan .next button:first-child { border-color: var(--c); }
  .tasks li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .tasks ul { list-style: none; padding: 0; margin: 8px 0 0; }
  .tasks .dt { color: var(--muted); font-size: 12.5px; min-width: 58px; }
  .tasks .late { color: #e8665a; }
  /* prenos znanja */
  .xfer .g { padding: 10px 0; border-top: 1px solid var(--line); }
  .xfer .g:first-of-type { border-top: 0; }
  .xfer .from { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .xfer .from b { color: var(--text); font-weight: 600; }
  .xfer .to { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .xfer .to button, .help li { font: 12.5px Inter, sans-serif; }
  .xfer .to button { color: var(--text); background: var(--bg); border: 1px solid var(--c); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .xfer .to .why { display: block; color: var(--muted); font-size: 11.5px; }
  .plan .next button.ready::before { content: "✦ "; color: var(--c); }
  .help { list-style: none; padding: 0; margin: 0; }
  .help li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13.5px; }
  .help .why { color: var(--muted); font-size: 12.5px; }
  .ring { pointer-events: none; animation: pulse 2.4s ease-in-out infinite; }
  /* pretekli kolokviji */
  .papers { margin-top: 14px; }
  .papers .hm { overflow-x: auto; margin-top: 10px; }
  .papers svg { display: block; width: 100%; min-width: 760px; height: auto; }
  .prow { cursor: pointer; }
  .prow:hover rect.bg { fill: var(--line); }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.15; margin: 0 2px; }
  .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }
  .probs { list-style: none; padding: 0; margin: 0; }
  .probs li { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .probs .src { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
  .probs .tx { font-size: 14px; line-height: 1.75; }
  .probs button { font: 12px Inter, sans-serif; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .probs button.ok { background: var(--c); border-color: var(--c); color: #111; font-weight: 600; }
  .gr { display: flex; flex-direction: column; gap: 6px; }
  .grow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .gl { font-size: 12px; color: var(--muted); width: 58px; }
  .gchip { font-size: 12.5px; color: var(--text); text-decoration: none; border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; padding: 3px 9px; background: var(--bg); }
  .gchip:hover { border-color: var(--c); }
  a.gchip::after { content: " ↗"; color: var(--muted); }
  .dt { border-collapse: collapse; margin: 6px 0 8px; font-size: 13px; }
  .dt th, .dt td { border: 1px solid var(--line); padding: 2px 12px; text-align: right; }
  .dt th { color: var(--muted); font-weight: 500; }
  /* kaj zdaj */
  .small { font-size: 12.5px; }
  .now { margin-top: 26px; }
  .sechead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .subjects { display: flex; flex-direction: column; gap: 12px; }
  .subj { display: grid; grid-template-columns: 210px 1fr 1fr; gap: 28px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 14px; padding: 16px 20px; }
  @media (max-width: 900px) { .subj { grid-template-columns: 1fr; gap: 14px; } }
  .subj .nm { font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .subj .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .subj .big { font: 400 36px/1 "Instrument Serif", serif; margin-top: 10px; color: var(--c); }
  .subj .bar { height: 6px; background: var(--line); border-radius: 3px; display: flex; overflow: hidden; margin: 14px 0 5px; }
  .subj .bar div { background: var(--c); }
  .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 7px; }
  .asks { margin: 0 0 6px; padding: 0; list-style: none; counter-reset: a; }
  .asks li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); cursor: pointer; font-size: 13.5px; counter-increment: a; }
  .asks li::before { content: counter(a) "."; color: var(--c); width: 16px; flex: none; }
  .asks li span:first-of-type { flex: 1; }
  .asks li:hover span:first-of-type { text-decoration: underline; }
  .asks .m { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips button { font: 12.5px Inter, sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .chips button:first-child { border-color: var(--c); }
  .chips button.ready::before { content: "✦ "; color: var(--c); }
  .subj .tasklist { margin-top: 8px; font-size: 13px; }
  .more { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; margin-top: -8px; }
  .more > button { background: none; border: 0; color: var(--muted); font: 13px Inter, sans-serif; cursor: pointer; padding: 0; }
  .more > button:hover { color: var(--text); }
  .papers-hm { overflow-x: auto; margin-top: 8px; }
  .papers-hm svg { display: block; width: 100%; min-width: 760px; height: auto; }
  /* panel teme */
  .drawer { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 20; opacity: 0; pointer-events: none; transform: translateY(14px); transition: opacity .2s, transform .2s; }
  .drawer.open { opacity: 1; pointer-events: auto; transform: none; }
  #detail { max-width: 820px; margin: 0 auto; padding: 0 22px 80px; }
  #detail h2 { font-size: 40px; line-height: 1.05; margin: 4px 0 8px; }
  .scrim { display: none; }
  .topbar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar > div { max-width: 820px; margin: 0 auto; padding: 12px 22px; display: flex; align-items: center; gap: 12px; }
  .x { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 6px 14px; font: 13.5px Inter, sans-serif; cursor: pointer; }
  .x:hover { border-color: var(--muted); }
  .topbar .crumb { color: var(--muted); font-size: 13px; }
  #detail > :first-child { margin-top: 28px; }
  .mx { display: inline-flex; flex-direction: column; vertical-align: middle; border-left: 1.5px solid currentColor; border-right: 1.5px solid currentColor; border-radius: 3px; padding: 1px 5px; margin: 0 2px; font-size: .92em; line-height: 1.3; }
  .mx > span { display: flex; gap: 10px; justify-content: space-between; }
  .mx i { font-style: normal; min-width: 14px; text-align: right; }
  .vec { text-decoration: overline; }
  /* podteme */
  .srow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .srow > span:first-child { flex: 1; }
  .srow.z > span:first-child { color: var(--muted); }
  .marks { display: flex; gap: 4px; flex: none; }
  .marks button { width: 30px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--faint); cursor: pointer; font: 600 13px Inter, sans-serif; }
  .marks button:hover { color: var(--text); border-color: var(--muted); }
  .marks button.z.on { background: var(--c); border-color: var(--c); color: #111; }
  .marks button.n.on { background: #3a2326; border-color: #e8665a; color: #ff8a7d; }
  .marks button.v.on { background: #fff; border-color: #fff; color: #111; }
  .mlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
  .mk { display: inline-block; width: 18px; text-align: center; margin-right: 4px; border-radius: 4px; }
  .mk.z { color: var(--c, #fff); } .mk.n { color: #ff8a7d; } .mk.v { color: #fff; }
  .tblock { margin-top: 18px; }
  .thead { display: flex; align-items: baseline; gap: 8px; cursor: pointer; font-weight: 600; margin-bottom: 4px; }
  .thead:hover .tn { text-decoration: underline; }
  .ktag { font-size: 11px; font-weight: 600; color: #111; background: var(--c); border-radius: 4px; padding: 0 5px; }
  .sbar { height: 8px; border-radius: 4px; background: var(--line); display: flex; overflow: hidden; margin: 14px 0 6px; }
  .scount { display: flex; gap: 14px; flex-wrap: wrap; }
  .ask { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
  .ask ul { margin: 0 0 10px; padding-left: 18px; font-size: 13.5px; line-height: 1.7; }
  .ask .copy, .opensubj { font: 12.5px Inter, sans-serif; color: var(--text); background: transparent; border: 1px solid var(--c, var(--line)); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .opensubj { margin-top: 14px; }
  .back { background: none; border: 0; color: var(--muted); cursor: pointer; font: 13px Inter, sans-serif; padding: 0; margin-bottom: 12px; }
  .back:hover { color: var(--text); }
  /* danes */
  .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 7px; }
  .today { list-style: none; padding: 0; margin: 0; }
  .today li { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 13.5px; }
  .today li > span { cursor: pointer; flex: 1; }
  .today li.done > span { text-decoration: line-through; color: var(--muted); }
  .ck { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--c); background: transparent; color: #111; font: 700 11px Inter, sans-serif; cursor: pointer; padding: 0; flex: none; }
  .today li.done .ck { background: var(--c); }
  .todaybtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .go { font: 12.5px Inter, sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--c, #d9d4ff); border-radius: 999px; padding: 5px 13px; cursor: pointer; }
  .go:hover { background: var(--line); }
  .go.big { font-size: 14px; padding: 8px 18px; font-weight: 600; }
  .go:disabled { opacity: .4; cursor: default; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
  .pk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border: 1px solid var(--c); border-radius: 999px; padding: 3px 4px 3px 10px; }
  .pk .dot { width: 7px; height: 7px; border-radius: 50%; }
  .pk button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 5px; }
  .psub { margin-top: 22px; }
  .psh { display: flex; align-items: center; gap: 8px; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--c); }
  .psh .dot { width: 9px; height: 9px; border-radius: 50%; }
  .ptopic { margin-top: 10px; }
  .ptn { font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .chipsx { display: flex; flex-wrap: wrap; gap: 5px; }
  .sc { font: 12px Inter, sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; cursor: pointer; text-align: left; }
  .sc.z { color: var(--muted); } .sc b { font-weight: 700; } .sc.n b { color: #ff8a7d; } .sc.z b { color: var(--c); }
  .sc.on { background: var(--c); border-color: var(--c); color: #111; } .sc.on b { color: #111; }
  /* kviz */
  .qdots { display: flex; gap: 5px; margin: 12px 0 18px; flex-wrap: wrap; }
  .qdots span { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
  .qdots .ok { background: #7fcf86; } .qdots .bad { background: #e8665a; } .qdots .cur { background: var(--c); }
  .qmeta { display: flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .qmeta .dot { width: 8px; height: 8px; border-radius: 50%; }
  .qq { font-size: 25px !important; line-height: 1.25 !important; margin: 8px 0 18px !important; }
  .qopts { display: flex; flex-direction: column; gap: 8px; }
  .qopts button { display: flex; gap: 12px; align-items: baseline; text-align: left; font: 14.5px/1.45 Inter, sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; }
  .qopts button:hover:not(:disabled) { border-color: var(--c); }
  .qopts .ol { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .qopts .right { border-color: #7fcf86; background: #1b2a1e; } .qopts .wrong { border-color: #e8665a; background: #2e1b1d; } .qopts .dim { opacity: .45; }
  .qwhy { margin: 16px 0; padding: 13px 15px; border-radius: 10px; font-size: 14px; line-height: 1.65; border-left: 3px solid; background: var(--bg); }
  .qwhy.ok { border-color: #7fcf86; } .qwhy.bad { border-color: #e8665a; }
  .qwhy svg { display: block; margin-top: 10px; }
  /* poskusni kolokvij */
  .test { position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow-y: auto; }
  .tin { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  .thd { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 1; }
  .clock { font: 400 46px/1 "Instrument Serif", serif; color: var(--c); font-variant-numeric: tabular-nums; }
  .tbarw { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .tbarw div { height: 100%; transition: width 1s linear; }
  .tp { border-top: 1px solid var(--line); padding: 18px 0; }
  .tp .tn { font-weight: 600; margin-bottom: 6px; color: var(--c); }
  .tp .tx { font-size: 15.5px; line-height: 1.8; }

  .symmini { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }

  .symc { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }

  .notesbtn { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 14px; font: 600 14px Inter, sans-serif; color: #111; background: var(--c); border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; }

  .npart p { font-size: 16px; line-height: 1.75; margin: 0 0 12px; }

  .zvl { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--c); margin-bottom: 4px; }
  .zvonly { margin: 14px 0; padding: 14px 18px; border: 2px dashed var(--c); border-radius: 12px; font-size: 17px; line-height: 1.95; }
  .zvh { font-weight: 600; font-size: 14px; color: var(--c); margin-bottom: 4px; }
  .nex { margin: 14px 0; padding: 14px 18px; background: var(--panel); border-radius: 12px; border-left: 3px solid var(--c); }
  .nq { font-size: 15.5px; line-height: 1.75; margin-bottom: 6px; }
  .nex ol, .nans ol { margin: 6px 0 0; padding-left: 22px; font-size: 15px; line-height: 1.85; }
  .nex ol li::marker, .nans ol li::marker { color: var(--c); font-weight: 600; }
  .ntask { padding: 14px 0; border-top: 1px dashed var(--line); }

  .tt { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .tt th { padding: 6px 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }

  .tt .t1 { color: #7fcf86; } .tt .t0 { color: #e8665a; opacity: .8; }
  .doneb { background: #7fcf86 !important; border-color: #7fcf86 !important; color: #111 !important; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
</style>

<body>

<header>
  <div>
    <h1>snou</h1>
    <div class="muted">Vse teme, vsi predmeti, vse povezave.</div>
    <button class="go" id="symbtn" style="margin-top:12px">∑ Slovar simbolov</button>
  </div>
  <div class="exams" id="exams"></div>
</header>

<div class="card days">
  <div class="hm" id="heatmap"></div>
  <div class="daylog" id="daylog"></div>
</div>

<div class="legend" id="legend"></div>

<div class="stage" id="stage">
  <svg id="svg"></svg>
  <div class="tip" id="tip"></div>
</div>

<section class="now">
  <div class="sechead"><h2>Kaj zdaj?</h2><span class="muted small">Ena kartica na predmet. Klikni katerokoli temo, da jo odpreš.</span></div>
  <div class="subjects" id="subjects"></div>
</section>

<div class="scrim" id="scrim"></div>
<div class="test" id="test" hidden></div>
<aside class="drawer" id="drawer"><div class="topbar"><div><button class="x" id="close">← Nazaj</button><span class="crumb">snou</span></div></div><div id="detail"></div></aside>

<script src="data.js"></script>
<script src="deep.js"></script>
<script src="log.js"></script>
<script src="naloge.js"></script>
<script src="sub.js"></script>
<script src="kviz.js"></script>
<script src="resitve.js"></script>
<script src="pravila.js"></script>
<script src="zapiski.js"></script>
<script>
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const subj = Object.fromEntries(SUBJECTS.map(s => [s.id, s]));
const topic = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const STATUS = ["ne znam", "vadim", "znam"];
const STATUS_OP = [0.3, 0.65, 1];

// ── shramba (lokalno v brskalniku) ──
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const TODAY_ISO = iso(TODAY);
let localStatus = load("snou-status2");
function computeStatus() {
  const st = {}, at = {};
  [...LOG].sort((a, b) => a.date.localeCompare(b.date)).forEach(e =>
    Object.entries(e.status || {}).forEach(([id, v]) => { st[id] = v; at[id] = e.date; }));
  Object.entries(localStatus).forEach(([id, {v, at: t}]) => { if (!at[id] || t >= at[id]) st[id] = v; });
  return st;
}
let status = computeStatus();
let notes = load("snou-notes");
let solved = load("snou-solved");
let marks = load("snou-marks");                 // "tema|podtema" → "z" znam · "n" ne znam · "v" vprašaj
const mkey = (tid, x) => `${tid}|${x}`;
let openSubj = null;
let mode = null;                                 // null | "plan" | "quiz"
let plans = load("snou-plan");                   // datum → [{ t, i, done }]
let quizLog = load("snou-quiz");                 // datum → število rešenih kvizov
let tests = (() => { try { return JSON.parse(localStorage.getItem("snou-tests")) || []; } catch { return []; } })();
let quiz = null;
let curPaper = null;
let wrong = load("snou-wrong");
const solOpen = {}, whyOpen = {};
const pkey = p => `${p.paper}-${p.n}`;

let selected = null, hovered = null;
let hidden = new Set();

// ── kolokviji ──
function renderExams() {
  const today = new Date(); today.setHours(0,0,0,0);
  const next = SUBJECTS.flatMap(s => {
    const d = s.exams.map(x => new Date(x + "T00:00")).filter(d => d >= today).sort((a,b) => a-b)[0];
    return d ? [{ s, d, days: Math.round((d - today) / 864e5) }] : [];
  }).sort((a,b) => a.days - b.days);
  $("#exams").innerHTML = next.map(({s, d, days}) => `
    <div class="exam ${days <= 14 ? "soon" : ""}">
      <div class="n">${days === 0 ? "danes" : days + " dni"}</div>
      <div class="l"><span class="dot" style="background:${s.color}"></span>${s.name} · ${d.toLocaleDateString("sl-SI", {day:"numeric", month:"short"})}</div>
    </div>`).join("");
}

// ── postavitev ──
const W = 1400, PAD = 30, BASE = 420, BAR = 16;
const pos = {};
(function layout() {
  const gap = 1.6;
  const units = TOPICS.length + gap * (SUBJECTS.length - 1);
  const step = (W - PAD * 2) / (units - 1);
  let u = 0;
  SUBJECTS.forEach((s, i) => {
    if (i) u += gap;
    TOPICS.filter(t => t.s === s.id).forEach(t => { pos[t.id] = PAD + u * step; u++; });
  });
})();

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function renderDiagram() {
  const svg = $("#svg");
  svg.innerHTML = "";
  let maxRy = 0;
  const defs = el("defs", {}, svg);

  // prelivi med barvami predmetov
  const grad = (a, b) => {
    const id = `g-${a}-${b}`;
    if (!svg.querySelector("#" + id)) {
      const g = el("linearGradient", { id }, defs);
      el("stop", { offset: "0%", "stop-color": subj[a].color }, g);
      el("stop", { offset: "100%", "stop-color": subj[b].color }, g);
    }
    return `url(#${id})`;
  };

  const gArcs = el("g", {}, svg);
  const gHits = el("g", {}, svg);
  LINKS.forEach(([a, b, why], i) => {
    if (!topic[a] || !topic[b]) return;
    let [l, r] = pos[a] < pos[b] ? [a, b] : [b, a];
    const rx = (pos[r] - pos[l]) / 2, ry = Math.min(rx * 0.62, BASE - 20);
    maxRy = Math.max(maxRy, ry);
    const d = `M ${pos[l]} ${BASE} A ${rx} ${ry} 0 0 1 ${pos[r]} ${BASE}`;
    const sl = topic[l].s, sr = topic[r].s;
    const arc = el("path", { d, class: "arc", stroke: sl === sr ? subj[sl].color : grad(sl, sr) }, gArcs);
    arc.dataset.a = a; arc.dataset.b = b;
    const hit = el("path", { d, class: "arc-hit" }, gHits);
    hit.addEventListener("mousemove", e => showTip(e, `<b>${topic[a].name}</b> ↔ <b>${topic[b].name}</b>${why ? "<br>" + why : ""}`));
    hit.addEventListener("mouseleave", hideTip);
    hit.addEventListener("click", () => select(a));
  });

  // osnovna črta in imena predmetov
  SUBJECTS.forEach(s => {
    const xs = TOPICS.filter(t => t.s === s.id).map(t => pos[t.id]);
    if (!xs.length) return;
    el("line", { x1: Math.min(...xs) - 6, x2: Math.max(...xs) + 6, y1: BASE + BAR + 4, y2: BASE + BAR + 4, stroke: s.color, "stroke-width": 2 }, svg);
  });

  // teme
  TOPICS.forEach(t => {
    const x = pos[t.id], s = subj[t.s], st = status[t.id] ?? 0;
    const g = el("g", { class: "bar" }, svg);
    el("rect", { x: x - 5, y: BASE, width: 10, height: BAR, rx: 2, fill: s.color, "fill-opacity": STATUS_OP[st] }, g);
    if (ready(t.id))
      el("rect", { class: "ring", x: x - 8, y: BASE - 3, width: 16, height: BAR + 6, rx: 4, fill: "none", stroke: s.color, "stroke-width": 1.5 }, g);
    if (typeof DEEP !== "undefined" && DEEP[t.id])
      el("circle", { class: "star", cx: x, cy: BASE - 7, r: 2.6, fill: "#fff", style: `filter: drop-shadow(0 0 4px ${s.color})` }, g);
    const lab = el("text", { class: "label", x: x + 4, y: BASE + BAR + 16, transform: `rotate(55 ${x + 4} ${BASE + BAR + 16})` }, g);
    lab.textContent = t.name;
    lab.dataset.id = t.id;
    g.addEventListener("mouseenter", () => { hovered = t.id; highlight(); });
    g.addEventListener("mouseleave", () => { hovered = null; highlight(); });
    g.addEventListener("click", () => select(t.id));
  });

  const top = BASE - maxRy - 16;
  svg.setAttribute("viewBox", `0 ${top} ${W + 60} ${BASE + 175 - top}`);
  highlight();
}

function highlight() {
  const svg = $("#svg");
  const focus = hovered || selected;
  const active = new Set();
  if (focus) {
    active.add(focus);
    LINKS.forEach(([a, b]) => { if (a === focus) active.add(b); if (b === focus) active.add(a); });
  }
  const filtering = hidden.size > 0;
  svg.classList.toggle("dim", !!focus || filtering);
  svg.querySelectorAll(".arc").forEach(p => {
    const {a, b} = p.dataset;
    const visible = !hidden.has(topic[a].s) || !hidden.has(topic[b].s);
    const on = focus ? (a === focus || b === focus) : visible;
    p.classList.toggle("on", on && (!filtering || visible));
  });
  svg.querySelectorAll(".label").forEach(l => {
    const id = l.dataset.id;
    l.classList.toggle("on", focus ? active.has(id) : (filtering && !hidden.has(topic[id].s)));
  });
}

// ── izbrana tema ──
function select(id) {
  mode = null;
  selected = selected === id ? null : id;
  if (selected && openSubj && topic[selected].s !== openSubj) openSubj = null;
  refreshDrawer(true);
}
function openSubject(sid) { mode = null; openSubj = sid; selected = null; refreshDrawer(true); }
function refreshDrawer(top) {
  renderLegend(); highlight(); renderPapers(); renderDetail();
  const on = !!(selected || openSubj || mode);
  $("#drawer").classList.toggle("open", on);
  $("#scrim").classList.toggle("open", on);
  if (on && top) $("#drawer").scrollTop = 0;
}
function closeDrawer() { selected = null; openSubj = null; mode = null; quiz = null; curPaper = null; refreshDrawer(); renderHeatmap(); }
function openPaper(id) { mode = "paper"; curPaper = id; selected = null; openSubj = null; refreshDrawer(true); }

// ── podteme ──
const MARKS = [["z", "✓", "znam"], ["n", "✗", "ne znam"], ["v", "?", "vprašaj Claude"]];
function subRows(t) {
  return (SUB[t.id] || []).map(x => { const m = marks[mkey(t.id, x)] || "";
    return `<div class="srow ${m}"><span>${x}</span><span class="marks">${MARKS.map(([k, ic, lbl]) =>
      `<button class="${k}${m === k ? " on" : ""}" data-mk="${mkey(t.id, x)}" data-v="${k}" title="${lbl}">${ic}</button>`).join("")}</span></div>`; }).join("");
}
function subCount(tids) {
  const c = { z: 0, n: 0, v: 0, all: 0 };
  tids.forEach(id => (SUB[id] || []).forEach(x => { c.all++; const m = marks[mkey(id, x)]; if (m) c[m]++; }));
  return c;
}
function bindMarks(box) {
  box.querySelectorAll("[data-mk]").forEach(b => b.onclick = () => {
    marks[b.dataset.mk] === b.dataset.v ? delete marks[b.dataset.mk] : (marks[b.dataset.mk] = b.dataset.v);
    save("snou-marks", marks); renderDetail(); renderSubjects(); renderLegend();
  });
}
const markLegend = `<div class="mlegend">${MARKS.map(([k, ic, lbl]) => `<span><b class="mk ${k}">${ic}</b>${lbl}</span>`).join("")}</div>`;

    ${markLegend}

      return `<div class="tblock" style="--c:${s.color}">

function deepHtml(t, s) {
  const d = (typeof DEEP !== "undefined") && DEEP[t.id];
  if (!d) return "";
  let h = `<div class="deep" style="--c:${s.color}">`;
  if (d.izvor) h += `<div class="sec">Od kod izvira</div><ul class="tl">${d.izvor.map(e =>
      `<li><span class="yr">${e.leto}</span><span class="tx">${e.txt}</span></li>`).join("")}</ul>`;
  if (d.ideja) h += `<div class="sec">Ideja</div><div class="ideja">${d.ideja.map(p => `<p>${p}</p>`).join("")}</div>`;
  if (d.slika) h += `<div class="pic">${d.slika}</div>`;
  if (d.definicija) h += `<div class="sec">Definicija</div><div class="defn">${d.definicija}</div>`;
  return h + `</div>`;
}

const fmt = (d, o) => d.toLocaleDateString("sl-SI", o);
const examDays = {};
SUBJECTS.forEach(s => s.exams.forEach(e => (examDays[e] ||= []).push(s)));
const logByDay = Object.fromEntries(LOG.map(e => [e.date, e]));
let pickedDay = TODAY_ISO;

function renderHeatmap() {
  const start = new Date(2026, 8, 28);               // ponedeljek pred 1. 10.
  const lastExam = Object.keys(examDays).sort().pop();
  const end = new Date(lastExam + "T00:00"); end.setDate(end.getDate() + 7);
  const C = 13, G = 3, L = 26, T = 18;
  const weeks = Math.ceil((end - start) / 864e5 / 7);
  let h = "", lastMonth = -1;
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(start.getDate() + w * 7 + d);
      const k = iso(day), x = L + w * (C + G), y = T + d * (C + G);
      if (d === 0 && day.getMonth() !== lastMonth && day.getDate() <= 7) {
        lastMonth = day.getMonth();
        h += `<text x="${x}" y="11" font-size="10.5" fill="var(--muted)">${fmt(day, {month: "short"})}</text>`;
      }
      const ex = examDays[k], lg = logByDay[k];
      const n = (lg ? lg.items.length : 0) + (plans[k] || []).filter(x => x.done).length + (quizLog[k] || 0);
      const future = day > TODAY;
      let fill = "var(--line)", op = future ? 0.45 : 1, stroke = "none";
      if (n) { fill = "#d9d4ff"; op = Math.min(0.35 + n * 0.18, 1); }
      if (ex) { fill = ex[0].color; op = 0.9; }
      if (k === TODAY_ISO) stroke = "#fff";
      if (k === pickedDay) stroke = "#fff";
      h += `<rect class="cell" data-k="${k}" x="${x}" y="${y}" width="${C}" height="${C}" rx="3" fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-width="${k === pickedDay ? 1.6 : 1}"${n ? ` style="filter:drop-shadow(0 0 3px #b9b0ff)"` : ""}/>`;
    }
  }
  ["pon", "", "sre", "", "pet", "", "ned"].forEach((t, d) => t && (h += `<text x="0" y="${T + d * (C + G) + 10}" font-size="10" fill="var(--faint)">${t}</text>`));
  const W2 = L + weeks * (C + G), H2 = T + 7 * (C + G);
  $("#heatmap").innerHTML = `<svg viewBox="0 0 ${W2} ${H2}">${h}</svg>`;
  $("#heatmap").querySelectorAll(".cell").forEach(r => r.onclick = () => { pickedDay = r.dataset.k; renderHeatmap(); });
  renderDayLog();
}

function renderDayLog() {
  const d = new Date(pickedDay + "T00:00"), lg = logByDay[pickedDay], ex = examDays[pickedDay] || [];
  const tasks = TASKS.filter(t => t.date === pickedDay);
  let h = `<div class="d">${pickedDay === TODAY_ISO ? "Danes · " : ""}${fmt(d, {weekday: "long", day: "numeric", month: "long"})}</div><ul>`;
  ex.forEach(s => h += `<li><span class="dot" style="background:${s.color}"></span><b>Kolokvij · ${s.name}</b></li>`);
  tasks.forEach(t => h += `<li><span class="dot" style="background:${subj[t.s].color}"></span>Rok: ${t.txt}</li>`);
  (lg ? lg.items : []).forEach(i => h += `<li><span class="dot" style="background:${subj[i.s]?.color || "#fff"}"></span>${i.txt}</li>`);
  const pl = plans[pickedDay] || [];
  if (!ex.length && !tasks.length && !lg && !pl.length && pickedDay !== TODAY_ISO) h += `<li class="muted">${new Date(pickedDay) > TODAY ? "Še ni načrtovano." : "Nič zapisanega."}</li>`;
  h += "</ul>";
  if (pickedDay === TODAY_ISO || pl.length) {
    h += `<div class="lbl" style="margin-top:12px">${pickedDay === TODAY_ISO ? "Danes študiram" : "Ta dan sem študirala"}</div>`;
    h += pl.length ? `<ul class="today">${pl.map((x, i) => { const t = topic[x.t], m = marks[mkey(x.t, SUB[x.t][x.i])] || "";
      return `<li class="${x.done ? "done" : ""}"><button class="ck" data-pi="${i}" style="--c:${subj[t.s].color}">${x.done ? "✓" : ""}</button>
        <span data-open-t="${t.id}"><span class="muted">${t.name}:</span> ${SUB[x.t][x.i]}</span>${m ? `<b class="mk ${m}" style="--c:${subj[t.s].color}">${MARKS.find(z => z[0] === m)[1]}</b>` : ""}</li>`; }).join("")}</ul>`
      : `<div class="muted small">Še nič izbrano.</div>`;
    if (pickedDay === TODAY_ISO) {
      const nq = quizFor(pl).length;
      h += `<div class="todaybtns"><button class="go" id="planbtn">${pl.length ? "Uredi" : "Izberi, kaj študiram"}</button>${nq ? `<button class="go" id="todayquiz">▶ Kviz iz današnjih tem · ${nq}</button>` : ""}</div>`;
    }
  }
  $("#daylog").innerHTML = h;
  $("#daylog").querySelectorAll("[data-pi]").forEach(b => b.onclick = () => {
    const x = plans[pickedDay][+b.dataset.pi]; x.done = !x.done; save("snou-plan", plans); renderHeatmap();
  });
  $("#daylog").querySelectorAll("[data-open-t]").forEach(e => e.onclick = () => { selected = null; select(e.dataset.openT); });
  const pb = $("#planbtn"); if (pb) pb.onclick = () => { if (!plans[TODAY_ISO]?.length) { plans[TODAY_ISO] = suggestPlan(); save("snou-plan", plans); } openPlan(); };
  const tq = $("#todayquiz"); if (tq) tq.onclick = () => startQuiz(quizFor(plans[TODAY_ISO]), "Današnje teme");
}

// ── pretekli kolokviji ──
function renderPapers() {
  document.querySelectorAll(".papers-hm").forEach(box => { if (!box.hidden) renderPapersFor(box.dataset.s, box); });
}
function renderPapersFor(sid, box) {
  const s = subj[sid];
  const rows = TOPICS.filter(t => t.s === sid);
  const papers = PAPERS.filter(p => p.s === sid && p.k > 0);
  const LW = 230, CW = 34, RH = 24, TOP = 44, GAP = 16;
  let x = LW, xs = {}, groups = [], last = null;
  papers.forEach(p => {
    if (last !== null && p.k !== last) x += GAP;
    if (p.k !== last) groups.push({ label: p.label, x0: x, k: p.k });
    xs[p.id] = x + CW / 2; x += CW; last = p.k;
    groups[groups.length - 1].x1 = x;
  });
  const W2 = x + 60, H2 = TOP + rows.length * RH + 6;
  const nextIdx = s.exams.findIndex(e => e >= TODAY_ISO) + 1;
  let h = "";
  groups.forEach(g => {
    const isNext = g.k === nextIdx;
    h += `<text x="${(g.x0 + g.x1) / 2}" y="14" text-anchor="middle" font-size="13" fill="${isNext ? s.color : "var(--muted)"}" font-weight="${isNext ? 600 : 400}">${g.label}${isNext ? " · " + fmt(new Date(s.exams[g.k - 1] + "T00:00"), {day: "numeric", month: "short"}) : ""}</text>`;
    h += `<line x1="${g.x0 + 4}" x2="${g.x1 - 4}" y1="21" y2="21" stroke="${isNext ? s.color : "var(--line)"}" stroke-width="1.5"/>`;
  });
  papers.forEach(p => h += `<text x="${xs[p.id]}" y="36" text-anchor="middle" font-size="9.5" fill="var(--faint)">${p.short || p.year.replace(/^20(\d\d)\/\d\d$/, "’$1").replace("avg 2026", "avg").replace("sep 2026", "sep")}</text>`);
  rows.forEach((t, i) => {
    const y = TOP + i * RH, cy = y + RH / 2;
    let row = `<rect class="bg" x="0" y="${y}" width="${W2}" height="${RH}" rx="4" fill="transparent"/>`;
    row += `<text x="${LW - 12}" y="${cy + 4}" text-anchor="end" font-size="12.5" fill="${selected === t.id ? "var(--text)" : "var(--muted)"}" font-weight="${selected === t.id ? 600 : 400}">${t.name}</text>`;
    let count = 0;
    papers.forEach(p => {
      p.tasks.forEach((tt, ti) => {
        if (!tt.includes(t.id)) return;
        count++;
        const pr = PROBLEMS.find(q => q.paper === p.id && q.n === ti + 1);
        const n = p.tasks.slice(0, ti).filter(z => z.includes(t.id)).length;   // več nalog iste teme
        const cx = xs[p.id] + n * 7 - (p.tasks.filter(z => z.includes(t.id)).length - 1) * 3.5;
        if (pr && solved[pkey(pr)]) row += `<circle cx="${cx}" cy="${cy}" r="6" fill="${s.color}" style="filter:drop-shadow(0 0 4px ${s.color})"/>`;
        else if (pr) row += `<circle cx="${cx}" cy="${cy}" r="5.5" fill="none" stroke="${s.color}" stroke-width="1.8"/>`;
        else row += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="${s.color}" fill-opacity=".45"/>`;
      });
    });
    row += `<text x="${x + 14}" y="${cy + 4}" font-size="12" fill="${count ? "var(--text)" : "var(--faint)"}">${count ? "×" + count : "–"}</text>`;
    h += `<g class="prow" data-id="${t.id}">${row}</g>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W2} ${H2}" style="max-width:${W2}px;min-width:0">${h}</svg>`;
  box.querySelectorAll(".prow").forEach(g => g.onclick = () => {
    selected = null; select(g.dataset.id);
  });
}

// Teme iz DRUGIH predmetov, ki jih že vadiš ali znaš in so povezane s to temo.
function support(id) {
  const t = topic[id];
  return LINKS.filter(([a, b]) => a === id || b === id)
    .map(([a, b, why]) => ({ o: topic[a === id ? b : a], why }))
    .filter(({o}) => o && o.s !== t.s && (status[o.id] ?? 0) >= 1)
    .map(x => ({ ...x, v: status[x.o.id] }));
}
const ready = id => (status[id] ?? 0) < 2 && support(id).length > 0;

// ── rešitve korak za korakom ──
function solBlock(p) {
  const k = pkey(p), S = SOL[`${p.paper}|${p.n}`];
  const res = solved[k] ? "ok" : wrong[k] ? "bad" : "";
  let h = "";
  if (!S) return h;
  const n = solOpen[k] || 0;
  if (!n) return `<div class="solbar"><button class="go" data-sol="${k}" data-n="1">Pokaži 1. korak</button><button class="go" data-sol="${k}" data-n="${S.steps.length}">Pokaži celo rešitev</button>${selfCheck(k, res)}</div>`;
  h += `<ol class="steps">${S.steps.slice(0, n).map(([st, why, pic], i) => {
    const wk = `${k}#${i}`, open = whyOpen[wk];
    return `<li><div class="st">${st}</div>${why || pic ? `<button class="why" data-why="${wk}">${open ? "Skrij razlago" : "Zakaj?"}</button>` : ""}
      ${open ? `<div class="expl">${why || ""}${pic ? `<div class="epic">${pic}</div>` : ""}</div>` : ""}</li>`; }).join("")}</ol>`;
  if (n < S.steps.length) h += `<div class="solbar"><button class="go" data-sol="${k}" data-n="${n + 1}">Naslednji korak ↓</button><button class="go" data-sol="${k}" data-n="${S.steps.length}">Pokaži vse</button></div>`;
  else h += `<div class="answer"><span class="lbl" style="margin:0">Rezultat</span><div>${S.ans}</div></div>`;
  return h + `<div class="solbar">${n ? `<button class="go" data-sol="${k}" data-n="0">Skrij rešitev</button>` : ""}${selfCheck(k, res)}</div>`;
}
function selfCheck(k, res) {
  return `<span class="selfck"><span class="muted small">Moja rešitev:</span>
    <button data-res="${k}|ok" class="${res === "ok" ? "on ok" : ""}">✓ prav</button><button data-res="${k}|bad" class="${res === "bad" ? "on bad" : ""}">✗ napaka</button></span>`;
}
function bindSol(box, rerender) {
  box.querySelectorAll("[data-sol]").forEach(b => b.onclick = () => { solOpen[b.dataset.sol] = +b.dataset.n; keepScroll(rerender); });
  box.querySelectorAll("[data-why]").forEach(b => b.onclick = () => { whyOpen[b.dataset.why] = !whyOpen[b.dataset.why]; keepScroll(rerender); });
  box.querySelectorAll("[data-res]").forEach(b => b.onclick = () => {
    const [k, r] = b.dataset.res.split("|");
    if (r === "ok") { solved[k] ? delete solved[k] : (solved[k] = TODAY_ISO); delete wrong[k]; }
    else { wrong[k] ? delete wrong[k] : (wrong[k] = TODAY_ISO); delete solved[k]; }
    save("snou-solved", solved); save("snou-wrong", wrong); keepScroll(rerender); renderSubjects();
  });
}

// ── današnji načrt ──
function nextK(s) { const ni = s.exams.findIndex(e => e >= TODAY_ISO); return ni < 0 ? null : ni + 1; }
function examFreq(s) {
  const k = nextK(s), f = {};
  PAPERS.filter(p => p.s === s.id && p.k === k).forEach(p => new Set(p.tasks.flat()).forEach(id => f[id] = (f[id] || 0) + 1));
  return f;
}
function topicOrder(s) {
  const k = nextK(s), f = examFreq(s);
  return TOPICS.filter(t => t.s === s.id)
    .map((t, i) => ({ t, i, on: !t.k || (t.k || []).includes(k) ? 1 : 0, f: f[t.id] || 0 }))
    .sort((a, b) => b.on - a.on || b.f - a.f || a.i - b.i).map(x => x.t);
}
function suggestPlan() {
  const out = [];
  SUBJECTS.filter(s => nextK(s)).sort((a, b) => a.exams[nextK(a) - 1].localeCompare(b.exams[nextK(b) - 1])).forEach(s => {
    const prio = m => m === "n" ? 0 : m === "v" ? 1 : !m ? 2 : 9;
    let best = null;
    topicOrder(s).forEach((t, ti) => (SUB[t.id] || []).forEach((x, i) => {
      const p = prio(marks[mkey(t.id, x)]);
      if (p < 9 && (!best || p < best.p || (p === best.p && ti < best.ti))) best = { t: t.id, i, p, ti };
    }));
    if (best) out.push({ t: best.t, i: best.i, done: false });
  });
  return out;
}

// ── kviz ──
function quizFor(pl) {
  const exact = QUIZ.filter(q => (pl || []).some(x => x.t === q.t && x.i === q.s));
  const topicLevel = QUIZ.filter(q => !exact.includes(q) && (pl || []).some(x => x.t === q.t));
  return [...exact, ...topicLevel].slice(0, Math.max(exact.length, 8));
}
function startQuiz(qs, title) {
  if (!qs.length) return;

  mode = "quiz"; selected = null; openSubj = null; refreshDrawer(true);
}

    <h2 class="qq">${q.q}</h2>
    <div class="qopts">${q.opts.map((o, i) => `<button data-o="${i}" class="${picked === undefined ? "" : i === q.a ? "right" : i === picked ? "wrong" : "dim"}" ${picked === undefined ? "" : "disabled"}><span class="ol">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>
    ${picked === undefined ? "" : `<div class="qwhy ${picked === q.a ? "ok" : "bad"}"><b>${picked === q.a ? "Pravilno." : "Ne čisto."}</b> ${q.why}</div>
      <button class="go big" id="qnext">${Q.i + 1 < Q.qs.length ? "Naprej →" : "Rezultat →"}</button>`}`;
  box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { Q.ans[Q.i] = +b.dataset.o; renderQuizView(); });
  const nx = $("#qnext"); if (nx) nx.onclick = () => { Q.i++; renderQuizView(); $("#drawer").scrollTop = 0; };
}
function renderQuizEnd() {
  const box = $("#detail"), Q = quiz, right = Q.qs.filter((q, i) => Q.ans[i] === q.a).length;
  const bySub = {};
  Q.qs.forEach((q, i) => { const k = mkey(q.t, SUB[q.t][q.s]); (bySub[k] ||= { t: q.t, x: SUB[q.t][q.s], ok: 0, n: 0 }); bySub[k].n++; if (Q.ans[i] === q.a) bySub[k].ok++; });
  if (!Q.saved) {

    save("snou-marks", marks);
    quizLog[TODAY_ISO] = (quizLog[TODAY_ISO] || 0) + 1; save("snou-quiz", quizLog);
    Q.saved = true; renderLegend(); renderSubjects();
  }
  const pct = Math.round(right / Q.qs.length * 100), R = 52, C = 2 * Math.PI * R;
  box.innerHTML = `
    <div style="font-size:12px;color:var(--muted)">Kviz · ${Q.title}</div>
    <h2>Rezultat</h2>
    <svg viewBox="0 0 140 140" style="width:150px;display:block;margin:10px 0">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="${pct >= 70 ? "#7fcf86" : pct >= 40 ? "#f2b84b" : "#e8665a"}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C * pct / 100} ${C}" transform="rotate(-90 70 70)"/>
      <text x="70" y="78" text-anchor="middle" font-size="26" fill="var(--text)" font-family="Instrument Serif, serif">${right}/${Q.qs.length}</text></svg>
    <div class="muted small" style="margin-bottom:10px">Podteme sem označila namesto tebe: vse prav = ✓ znam, kaj narobe = ✗ ne znam.</div>
    ${Object.values(bySub).map(r => `<div class="srow ${r.ok === r.n ? "z" : ""}" style="--c:${subj[topic[r.t].s].color}"><span><span class="muted">${topic[r.t].name}:</span> ${r.x}</span>
      <b class="mk ${r.ok === r.n ? "z" : "n"}">${r.ok === r.n ? "✓" : "✗"}</b><span class="muted small">${r.ok}/${r.n}</span></div>`).join("")}
    <div class="todaybtns" style="margin-top:16px"><button class="go" id="again">Ponovi napačne</button><button class="go" id="qclose">Zapri</button></div>`;
  const wrong = Q.qs.filter((q, i) => Q.ans[i] !== q.a);
  $("#again").onclick = () => wrong.length ? startQuiz(wrong, Q.title + " · napačne") : closeDrawer();
  $("#qclose").onclick = closeDrawer;
}

// ── poskusni kolokvij ──
let test = null, testTimer = null;
function canTest(s) {
  const k = nextK(s);
  return k && PAPERS.filter(p => p.s === s.id && p.k === k && PROBLEMS.some(q => q.paper === p.id)).length >= 2;
}
function startTest(sid) {
  const s = subj[sid], k = nextK(s);
  const papers = PAPERS.filter(p => p.s === sid && p.k === k && PROBLEMS.some(q => q.paper === p.id)).sort(() => Math.random() - .5);
  const n = Math.max(...papers.map(p => p.tasks.length));
  const probs = [];
  for (let i = 1; i <= n; i++) {
    const cand = papers.map(p => PROBLEMS.find(q => q.paper === p.id && q.n === i)).filter(Boolean);
    if (cand.length) probs.push(cand[(i - 1) % cand.length]);
  }
  test = { sid, k, probs, start: Date.now(), dur: 90 * 60 * 1000, grades: probs.map(() => null), done: false };
  renderTest(); $("#test").hidden = false; document.body.style.overflow = "hidden";
  clearInterval(testTimer); testTimer = setInterval(tick, 1000);
}
function tick() {
  if (!test || test.done) return;
  const left = Math.max(0, test.dur - (Date.now() - test.start));
  const el = $("#tclock"); if (el) el.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
  const bar = $("#tbar"); if (bar) bar.style.width = (left / test.dur * 100) + "%";
  if (left === 0) finishTest();
}
function finishTest() { test.done = true; clearInterval(testTimer); renderTest(); }
function closeTest() { $("#test").hidden = true; document.body.style.overflow = ""; clearInterval(testTimer); test = null; renderSubjects(); }
function renderTest() {
  const T = test, s = subj[T.sid];
  const pa = q => PAPERS.find(p => p.id === q.paper);
  if (!T.done) {
    $("#test").innerHTML = `<div class="tin" style="--c:${s.color}">
      <div class="thd"><div><div class="muted small">Poskusni kolokvij</div><h2>${s.name} · ${T.k}. kolokvij</h2></div>
        <div class="clock" id="tclock">90:00</div></div>
      <div class="tbarw"><div id="tbar" style="background:${s.color}"></div></div>
      <div class="muted small" style="margin:12px 0 4px">Reši na papir, kot na pravem kolokviju: 90 minut, en list A4 s formulami, vse odgovore utemelji. Naloge so iz različnih let.</div>
      ${T.probs.map((q, i) => `<div class="tp"><div class="tn">${i + 1}. naloga <span class="muted small">· ${pa(q).year}</span></div><div class="tx">${q.text}</div></div>`).join("")}
      <div class="todaybtns"><button class="go big" id="tfin">Končala sem →</button><button class="go" id="tquit">Prekini</button></div></div>`;
    $("#tfin").onclick = finishTest; $("#tquit").onclick = closeTest; tick();
    return;
  }
  const used = Math.min(T.dur, Date.now() - T.start), all = T.grades.every(g => g !== null);
  const score = T.grades.reduce((a, g) => a + (g || 0), 0) / T.probs.length;
  $("#test").innerHTML = `<div class="tin" style="--c:${s.color}">
    <div class="thd"><div><div class="muted small">Poskusni kolokvij · ${Math.round(used / 60000)} min</div><h2>Oceni se sama</h2></div>
      ${all ? `<div class="clock">${Math.round(score * 100)} %</div>` : ""}</div>
    <div class="muted small" style="margin:8px 0 6px">Za vsako nalogo iskreno: koliko bi dobila na pravem kolokviju? Če ne veš, odpri nalogo na strani in mi pošlji, kar si napisala.</div>
    ${T.probs.map((q, i) => `<div class="tp"><div class="tn">${i + 1}. naloga <span class="muted small">· ${pa(q).year} · ${topic[q.t].name}</span></div><div class="tx">${q.text}</div>
      <div class="grade">${[[0, "Nič"], [.5, "Pol"], [1, "Vse"]].map(([v, l]) => `<button data-g="${i}|${v}" class="${T.grades[i] === v ? "on" : ""}">${l}</button>`).join("")}</div></div>`).join("")}
    <div class="todaybtns"><button class="go big" id="tsave" ${all ? "" : "disabled"}>Shrani in zapri</button></div></div>`;
  $("#test").querySelectorAll("[data-g]").forEach(b => b.onclick = () => { const [i, v] = b.dataset.g.split("|"); T.grades[+i] = +v; renderTest(); });
  $("#tsave").onclick = () => {
    tests.push({ s: T.sid, k: T.k, date: TODAY_ISO, score: Math.round(score * 100), min: Math.round(used / 60000) });
    try { localStorage.setItem("snou-tests", JSON.stringify(tests)); } catch {}
    T.probs.forEach((q, i) => { if (T.grades[i] === 1) solved[pkey(q)] = TODAY_ISO; });
    save("snou-solved", solved);
    quizLog[TODAY_ISO] = (quizLog[TODAY_ISO] || 0) + 2; save("snou-quiz", quizLog);
    closeTest(); renderHeatmap();
  };
}

// ── kaj zdaj: ena kartica na predmet ──
let showAllPapers = {};
function renderSubjects() {
  $("#subjects").innerHTML = SUBJECTS.map(s => {
    const ts = TOPICS.filter(t => t.s === s.id), { c, n } = counts(s.id);
    const ni = s.exams.findIndex(e => e >= TODAY_ISO), next = ni >= 0 ? s.exams[ni] : null, k = ni + 1;
    const days = next ? Math.round((new Date(next + "T00:00") - TODAY) / 864e5) : null;
    const tagged = ts.some(t => t.k);
    const scope = tagged && next ? ts.filter(t => (t.k || []).includes(k)) : ts;
    const papers = PAPERS.filter(p => p.s === s.id && p.k === k && next);
    const freq = {}; papers.forEach(p => new Set(p.tasks.flat()).forEach(id => freq[id] = (freq[id] || 0) + 1));
    const left = scope.filter(t => (status[t.id] ?? 0) < 2)
      .map((t, i) => ({ t, i, f: freq[t.id] || 0, r: ready(t.id) ? 1 : 0 }))
      .sort((a, b) => b.f - a.f || b.r - a.r || a.i - b.i).map(x => x.t);
    const tasks = TASKS.filter(t => t.s === s.id && !t.done).sort((a, b) => a.date.localeCompare(b.date));

    let mid = "";
    if (papers.length) {
      const cnt = {};
      papers.forEach(p => new Set(p.tasks.flat()).forEach(id => cnt[id] = (cnt[id] || 0) + 1));
      const rows = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
      mid = `<div class="lbl">Kaj pride na ${k}. kolokvij</div>
        <ol class="asks">${rows.map(([id, m]) => `<li data-id="${id}"><span>${topic[id].name}</span><span class="m">${m === papers.length ? "vsako leto" : `${m} od ${papers.length} let`}</span></li>`).join("")}</ol>
        <div class="muted small">Iz ${papers.length} preteklih kolokvijev.</div>
        <div class="todaybtns">${canTest(s) ? `<button class="go" data-test="${s.id}">▶ Poskusni kolokvij · 90 min</button>` : ""}<button class="go" data-sheet="${s.id}">📄 List s formulami</button></div>
        ${(() => { const h = tests.filter(x => x.s === s.id && x.k === k).slice(-8); if (!h.length) return "";
          return `<div class="thist">${h.map(x => `<div title="${x.date}: ${x.score} %"><span style="height:${Math.max(x.score, 4)}%;background:${s.color}"></span><i>${x.score}</i></div>`).join("")}</div>`; })()}`;
    } else if (next) {
      mid = `<div class="lbl">Kaj pride na ${k}. kolokvij</div><div class="muted small">Še ne vem. Pošlji mi pretekle kolokvije in ti pokažem.</div>`;
    } else {
      mid = `<div class="lbl">Roki</div>${tasks.length ? "" : `<div class="muted small">Ni kolokvija. Pošlji mi roke za poročila in oddaje.</div>`}`;
    }
    const taskHtml = tasks.length ? `<div class="tasklist">${tasks.map(t => `<div><span class="muted">${fmt(new Date(t.date + "T00:00"), {day: "numeric", month: "short"})}</span> · ${t.txt}</div>`).join("")}</div>` : "";

    return `<div class="subj" style="--c:${s.color}">
      <div>
        <div class="nm"><span class="dot"></span>${s.name}</div>
        ${next ? `<div class="big">${days === 0 ? "danes" : days + " dni"}</div><div class="muted small">do ${k}. kolokvija · ${fmt(new Date(next + "T00:00"), {day: "numeric", month: "long"})}</div>` : ""}
        ${NOTES.some(x => x.s === s.id) ? `<button class="notesbtn" data-notes="${s.id}">📓 Zapiski <span>${NOTES.filter(x => x.s === s.id && readN[x.id]).length}/${NOTES.filter(x => x.s === s.id).length}</span></button>` : ""}
        <div class="bar"><div style="width:${c[2] / n * 100}%"></div><div style="width:${c[1] / n * 100}%;opacity:.45"></div></div>
        <div class="muted small">${c[2]} od ${n} tem znaš${c[1] ? ` · ${c[1]} vadiš` : ""}</div>

      </div>
      <div>${mid}${next ? "" : taskHtml}
        ${(() => { const L = papersWithSol(s.id); if (!L.length) return "";
          return `<div class="lbl" style="margin-top:16px">Rešene naloge · klikni in vadi</div><div class="papchips">${L.map(p => {
            const pr = PROBLEMS.filter(q => q.paper === p.id), d = pr.filter(q => solved[pkey(q)]).length;
            return `<button data-paper="${p.id}"><b>${p.k === 0 ? p.label : p.k === 9 ? "Izpit" : "K" + p.k}</b> ${p.short || p.year}<span class="pdots">${pr.map(q => `<i class="${solved[pkey(q)] ? "ok" : wrong[pkey(q)] ? "bad" : ""}"></i>`).join("")}</span></button>`; }).join("")}</div>`; })()}
      </div>
      <div>
        <div class="lbl">Naslednje${tagged && next ? ` za ${k}. kolokvij` : ""}</div>
        <div class="chips">${left.slice(0, 4).map(t => `<button data-id="${t.id}" class="${ready(t.id) ? "ready" : ""}">${t.name}</button>`).join("") || `<span class="muted small">Vse znaš. Ponavljaj.</span>`}</div>
        ${next && left.length ? `<div class="muted small">${left.length} tem še ni »znam« · ≈ ${Math.ceil(left.length / Math.max(days / 7, 0.5))} na teden</div>` : ""}
        ${left.some(t => ready(t.id)) ? `<div class="muted small">✦ del te teme že znaš iz drugega predmeta</div>` : ""}
        ${next ? taskHtml : ""}
      </div>
      ${PAPERS.some(p => p.s === s.id && p.k > 0) ? `<div class="more"><button class="toggle" data-s="${s.id}">${showAllPapers[s.id] ? "▾ Skrij" : "▸ Pokaži"} vse pretekle kolokvije</button><div class="papers-hm" data-s="${s.id}" ${showAllPapers[s.id] ? "" : "hidden"}></div></div>` : ""}
    </div>`;
  }).join("");
  $("#subjects").querySelectorAll("[data-id]").forEach(b => b.onclick = () => { selected = null; select(b.dataset.id); });
  $("#subjects").querySelectorAll("[data-test]").forEach(b => b.onclick = () => startTest(b.dataset.test));
  $("#subjects").querySelectorAll("[data-paper]").forEach(b => b.onclick = () => openPaper(b.dataset.paper));
  $("#subjects").querySelectorAll("[data-sheet]").forEach(b => b.onclick = () => openSheet(b.dataset.sheet));
  $("#subjects").querySelectorAll("[data-notes]").forEach(b => b.onclick = () => openNotes(b.dataset.notes));
  $("#subjects").querySelectorAll(".toggle").forEach(b => b.onclick = () => { showAllPapers[b.dataset.s] = !showAllPapers[b.dataset.s]; renderSubjects(); });
  renderPapers();
}

$("#scrim").onclick = closeDrawer;
$("#symbtn").onclick = openSymbols;
$("#close").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

renderExams(); renderHeatmap(); renderLegend(); renderDiagram(); renderSubjects();
</script>
</body>
